<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PequeMundo</title>
<style>
:root{--bg:#fff7e0;--ink:#3b3355;--card:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#fff7e0;--ink:#3b3355;--card:#fff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:linear-gradient(#bfe9ff,var(--bg) 60%);color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#app{height:100%;display:flex;flex-direction:column;align-items:center;padding:12px;overflow:auto}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;max-width:900px}
.rb{border:0;border-radius:50%;width:64px;height:64px;font-size:30px;background:#fff;box-shadow:0 4px 0 #0002;cursor:pointer}
h1{margin:4px 0;font-size:clamp(24px,5vw,38px)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;width:100%;max-width:900px;margin-top:10px}
.cat{border:0;border-radius:26px;padding:16px 6px;font-size:18px;font-weight:800;color:#fff;box-shadow:0 6px 0 #0003;cursor:pointer}
.cat span{display:block;font-size:54px}
.cat:active,.opt:active{transform:translateY(4px)}
.stage{flex:1;width:100%;max-width:900px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.big{font-size:clamp(70px,18vw,140px);line-height:1}
.row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.opt{border:0;border-radius:24px;min-width:90px;min-height:90px;font-size:48px;background:var(--card);box-shadow:0 6px 0 #0002;cursor:pointer;font-weight:800;color:var(--ink)}
.dot{width:90px;height:90px;border-radius:50%;border:5px solid #fff;box-shadow:0 5px 0 #0003;cursor:pointer}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pp .6s}@keyframes pp{50%{transform:scale(1.25) rotate(8deg)}}
.hint{outline:6px solid #ffd54a}
.star{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:140px;pointer-events:none;animation:pp .9s forwards}
canvas,svg.paint{background:#fff;border-radius:20px;box-shadow:0 4px 0 #0002;touch-action:none;max-width:100%}
.pz{display:grid;gap:4px;width:min(80vw,360px);aspect-ratio:1/1}
.pz div{border-radius:8px;cursor:pointer;background-repeat:no-repeat}
.pz .sel{outline:6px solid #ff7043}
.adult{background:#fff;border-radius:20px;padding:18px;max-width:420px;width:100%;text-align:left;font-size:18px}
.adult button{font-size:18px;padding:10px 14px;border-radius:12px;border:2px solid #3b3355;background:#fff;color:#3b3355;font-weight:800;margin:3px;cursor:pointer}:root{color-scheme:light}
.adult button.on{background:#ffd54a}
.nb{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);right:12px;width:56px;height:56px;border-radius:50%;opacity:.7;border:0;background:#fffc;font-size:30px;z-index:3}.grid{padding-bottom:76px}
.ap *{animation:none!important}.sc text{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{50%{transform:translateY(-1.4px)}}.car{width:90px;height:90px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:52px;cursor:grab;touch-action:none;box-shadow:0 5px 0 #0003;position:relative}.car.sel{outline:5px solid #ffd54a}.gar{width:110px;height:110px;border:5px dashed;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:40px}.gar .car{width:80px;height:80px;box-shadow:none}.map{position:relative;width:min(94vw,520px);height:min(60vh,400px);border-radius:24px;box-shadow:0 5px 0 #0003;background:linear-gradient(#9e9e9e,#9e9e9e) center/100% 26% no-repeat,linear-gradient(#9e9e9e,#9e9e9e) center/14% 100% no-repeat,#a5d6a7}.pl{position:absolute;width:120px;height:110px;margin:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fffd;border-radius:20px;font-size:14px;cursor:pointer}.cars{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:12px;pointer-events:none}.cars .car{pointer-events:auto;background:none;box-shadow:none;font-size:68px}.cars .car.sel{outline:none;filter:drop-shadow(0 0 8px #ffd54a)}.logo{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:12px;font-weight:800;text-align:center}.logo img{width:100%;height:100%;object-fit:contain}
</style></head><body><div id="app"></div>

let ac;function tone(f,d=.18,t='sine'){if(!S.snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=.12;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}

let lw=0;function win(cat){if(Date.now()-lw<1000)return;lw=Date.now();[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.25),i*130));say(rnd(['¡Muy bien!','¡Genial!','¡Lo lograste!','¡Bravo!']));S.prog[cat]=(S.prog[cat]||0)+1;save();const s=document.createElement('div');s.className='star';s.textContent='⭐';document.body.appendChild(s);setTimeout(()=>s.remove(),900)}

function scene(k,i,fb){const b=BG['fph'[k]]||BG.f,sp=(SC[k+'-'+i]||'').split('|').filter(Boolean);const x=s=>{const [t,a,y,z]=s.split(',');return `<text x="${a}" y="${y}" font-size="${z}" text-anchor="middle" dominant-baseline="central" style="animation-delay:${(a%7)/5}s">${t}</text>`};return `<svg class="sc" viewBox="0 0 100 60" style="width:min(92vw,480px);height:auto;border-radius:22px;box-shadow:0 5px 0 #0003"><rect width="100" height="60" fill="${b[0]}"/><circle cx="90" cy="10" r="6" fill="#ffd54a"/><path d="M0 40Q50 33 100 40V60H0Z" fill="${b[1]}"/>${b[2].split('|').map(x).join('')}${sp.length?sp.map(x).join(''):x(fb+',50,36,28')}</svg>`}
function story(){const st=shell('Cuentos','#6d4c41');st.innerHTML=`<div class="row" style="flex-direction:column;align-items:stretch;width:100%;max-width:480px">${SS.map((s,i)=>`<button class="opt" data-s="${i}" style="display:flex;align-items:center;gap:14px;text-align:left;font-size:22px;padding:12px 16px;width:100%"><span style="font-size:56px">${s.e}</span><span>${s.t}<br><small style="font-size:14px;font-weight:600">${s.l}</small></span></button>`).join('')}</div>`;say('Elegí un cuento');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>read(+b.dataset.s))}
function read(k){const c=SS[k],st=shell(c.t,'#6d4c41');let i=0;$('#bk').textContent='📚';$('#bk').onclick=story;
const show=()=>{const sc=c.sc[i];st.innerHTML=`<div style="font-size:16px;letter-spacing:2px">${'●'.repeat(i+1)}${'○'.repeat(c.sc.length-i-1)}</div><div class="pop" id="e">${scene(k,i,sc[0])}</div><div style="font-size:24px;font-weight:700;max-width:520px">${sc[1]}</div>${i==c.q[0]?`<div class="row">${c.q[1].map(o=>`<button class="opt" data-a="${o[2]}" style="font-size:54px">${o[0]}<div style="font-size:18px">${o[1]}</div></button>`).join('')}</div>`:''}<div class="row"><button class="opt" id="pv">⬅️</button><button class="opt" id="rp" style="font-size:36px">🔊</button><button class="opt" id="nx">➡️</button></div>`;

document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{S.lv=+b.dataset.l;save();draw()});$('#s1').onclick=()=>{S.snd=S.snd?0:1;save();draw()};$('#s2').onclick=()=>{S.nar=S.nar?0:1;save();draw()};$('#rp').onclick=()=>{S.prog={};save();draw()};$('#ap').onclick=()=>{S.ap=S.ap?0:1;save();document.body.classList.toggle('ap',!!S.ap);draw()};document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.rest=+b.dataset.r;save();startRest();draw()});$('#lg').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=120;const x=c.getContext('2d');const s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,120,120);S.logo=c.toDataURL('image/png');save();draw()};im.onerror=()=>alert('No se pudo leer la imagen');im.src=URL.createObjectURL(f)}};draw()}
